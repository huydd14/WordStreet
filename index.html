<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordStreet — English for Finance (TOEIC 800+ & C1)</title>
  <meta name="description" content="WordStreet: tự học tiếng Anh tài chính và 600 từ vựng TOEIC — đọc báo kinh tế, tra và lưu từ, ôn tập ngắt quãng, luyện đề TOEIC 800+ và C1." />
  <meta name="theme-color" content="#1f3d35" />
  <!-- Logo: chữ W vẽ bằng đường biểu đồ đi lên -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f3d35'/%3E%3Cpath d='M6 10.5l5 11 5-7.5 5 7.5 5-12' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M22.6 9.6L26 9.5l.4 3.4' fill='none' stroke='%23f2d675' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <!-- Cài web như app trên điện thoại (PWA) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="WordStreet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#today" id="brand-link">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <rect width="32" height="32" rx="8" class="bm-bg" />
          <path d="M6 10.5l5 11 5-7.5 5 7.5 5-12" class="bm-line" />
          <path d="M22.6 9.6L26 9.5l.4 3.4" class="bm-arrow" />
        </svg>
      </span>
      <span class="brand-text">
        <strong id="app-name">WordStreet</strong>
        <small id="app-tagline">English for Finance</small>
      </span>
    </a>
    <nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
    <!-- Nút đồng bộ giữa các máy (js/sync.js tô màu chấm trạng thái) -->
    <a class="sync-btn" id="sync-btn" href="#sync" data-state="off" title="Đồng bộ giữa các máy" aria-label="Đồng bộ giữa các máy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5z"/></svg>
      <span class="sync-dot"></span>
    </a>
    <div class="accent-toggle" role="group" aria-label="Giọng phát âm">
      <button id="accent-us" type="button">US</button>
      <button id="accent-uk" type="button">UK</button>
    </div>
  </header>

  <!-- Tab con của mục đang mở (app.js tự vẽ) -->
  <nav id="subnav" class="subnav hidden" aria-label="Mục con"></nav>

  <div id="banner" class="banner hidden"></div>

  <main id="view" class="view" tabindex="-1"></main>

  <!-- Bảng tra từ -->
  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <aside id="sheet" class="sheet" aria-hidden="true" aria-label="Tra từ"></aside>

  <div id="toast" class="toast hidden" role="status"></div>

  <!-- Nội dung (bạn sửa trong thư mục data/) -->
  <script src="data/config.js"></script>
  <script src="data/terms.js"></script>
  <script src="data/toeic600-1.js"></script>
  <script src="data/toeic600-2.js"></script>
  <script src="data/toeic600-3.js"></script>
  <script src="data/toeic-extra-1.js"></script>
  <script src="data/toeic-extra-2.js"></script>
  <script src="data/toeic-extra-3.js"></script>
  <script src="data/toeic-extra-4.js"></script>
  <script src="data/phrases.js"></script>
  <script src="data/toeic-reading.js"></script>
  <script src="data/toeic-quiz.js"></script>
  <script src="data/articles.js"></script>
  <script src="data/quiz.js"></script>
  <script src="data/toeic-quiz-2.js"></script>
  <script src="data/toeic-part2.js"></script>
  <script src="data/toeic-part34.js"></script>
  <script src="data/toeic-part6.js"></script>
  <!-- Code ứng dụng -->
  <script src="js/app.js"></script>
  <!-- Các tính năng tách riêng (dùng hàm chung qua window.WS) -->
  <script src="js/listen.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/part2.js"></script>
  <script src="js/part34.js"></script>
  <script src="js/part6.js"></script>
  <script src="js/test.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/quicknote.js"></script>
  <script>
    // Bật chế độ app (chỉ chạy khi web nằm trên mạng, vd GitHub Pages; mở file trên máy thì bỏ qua)
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
